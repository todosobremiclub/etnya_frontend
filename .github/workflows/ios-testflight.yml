name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.0'
          channel: 'stable'

      - name: Instalar dependencias Flutter
        run: flutter pub get

      - name: Generar proyecto iOS sin firmar
        run: flutter build ios --release --no-codesign --verbose

      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Instalar fastlane y CocoaPods
        run: |
          gem install fastlane
          cd ios && pod install

      - name: Ejecutar fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: cd ios && fastlane beta